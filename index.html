<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <meta
      name="description"
      content="QuickDrop - upload, share, and manage your files securely."
    />
    <title>QuickDrop</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: #e2e8f0;
        background: #020617;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          linear-gradient(rgba(2, 6, 23, 0.68), rgba(2, 6, 23, 0.82)),
          url("src/main/resources/static/images/background.png") center / cover
            fixed;
      }

      nav {
        border-bottom: 1px solid rgba(148, 163, 184, 0.2);
        background: rgba(2, 6, 23, 0.78);
        backdrop-filter: blur(12px);
      }

      .nav-content,
      main {
        width: min(100% - 2rem, 72rem);
        margin: 0 auto;
      }

      .nav-content {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 4.5rem;
      }

      .brand {
        color: #f8fafc;
        font-size: 1.1rem;
        font-weight: 700;
        text-decoration: none;
      }

      .brand span {
        margin-left: 0.6rem;
        vertical-align: middle;
      }

      .brand img {
        width: 2.5rem;
        height: 2.5rem;
        vertical-align: middle;
        border-radius: 0.6rem;
      }

      .files-link {
        color: #bae6fd;
        font-weight: 600;
        text-decoration: none;
      }

      main {
        padding: 5rem 0;
      }

      .hero {
        max-width: 52rem;
        margin: 0 auto;
        padding: 3rem 2rem;
        border: 1px solid rgba(125, 211, 252, 0.25);
        border-radius: 1.5rem;
        background: rgba(15, 23, 42, 0.78);
        box-shadow: 0 1.5rem 5rem rgba(0, 0, 0, 0.35);
        text-align: center;
      }

      h1 {
        margin: 0;
        color: #f8fafc;
        font-size: clamp(2.25rem, 6vw, 4.5rem);
        line-height: 1.05;
      }

      p {
        max-width: 36rem;
        margin: 1.25rem auto 0;
        color: #cbd5e1;
        font-size: 1.1rem;
        line-height: 1.7;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 1rem;
        margin-top: 2rem;
      }

      .button {
        display: inline-block;
        padding: 0.8rem 1.25rem;
        border-radius: 0.6rem;
        font-weight: 700;
        text-decoration: none;
      }

      .primary {
        color: #082f49;
        background: #7dd3fc;
      }

      .secondary {
        color: #e0f2fe;
        border: 1px solid #475569;
      }

      @media (max-width: 40rem) {
        main {
          padding: 2rem 0;
        }

        .hero {
          padding: 2.25rem 1.25rem;
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <div class="nav-content">
        <a class="brand" href="/">
          <img
            alt="QuickDrop logo"
            src="src/main/resources/static/images/favicon.png"
          />
          <span>QuickDrop</span>
        </a>
        <a class="files-link" href="/file/list">View files</a>
      </div>
    </nav>
    <main>
      <section class="hero">
        <h1>Welcome to QuickDrop</h1>
        <p>Upload, share, and manage your files securely from anywhere.</p>
        <div class="actions">
          <a class="button primary" href="/file/upload">Upload a file</a>
          <a class="button secondary" href="/file/list">View files</a>
        </div>
      </section>
    </main>
  </body>
</html>
